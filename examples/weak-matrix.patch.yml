# 弱模型矩阵 + 强模型兜底 —— 来自 SWE-bench pilot 战役结论的示例组合。
#
# 战役数据(9 个配对实例):all-weak 9/9 解、$0.004/任务、62s,
# 优于 all-strong(8/9、$0.053)与静态分层(9/9、$0.062);
# 静态分层输在"强 leader 自己把活干了"(96.5% token)。
# 因此本组合把全部角色都放在快模型上,强模型只作失败兜底:
# 派发的子代理未完成结算(error / max-tokens / refusal)时,
# 插件自动用 fallback 路由重派一次,无需队长介入。
#
# 三个角色共用同一条弱路由和同一条强兜底,因此用 `extends` 收敛到
# 一个基角色 `worker`:provider/model/reasoningEffort/fallback 全部
# 沿继承链继承,就近声明优先,各角色只覆写自己的 brief(coder 加
# maxTokens 防推理失控)。`worker` 本身不被任何 kind 路由——只作
# 继承父角色的角色允许不被路由;未被路由且无人继承的角色仍然拒绝挂载。
#
# 只声明一个模式时不写 defaultMode —— 唯一的模式就是默认模式,
# 队长不需要选择,team_dispatch 也不会暴露 mode 参数。
# 多模式(快/均衡/严格)的写法见 modes.patch.yml。
#
# 用法:pnpm dsh --profile <profile> --patch weak-matrix.patch.yml "<任务>"

- insert:
    - id: team-orchestrator
      name: '@deepseek-ai/dsh-team-orchestrator'
      config:
        provider: spawn
        modes:
          fast:
            concurrency: 3
            roles:
              worker:
                provider: deepseek-official
                model: deepseek-flash
                reasoningEffort: low
                fallback:
                  provider: deepseek-official
                  model: deepseek-v4-pro
                  reasoningEffort: high
              planner:
                extends: worker
                brief: You are the planning role. Produce a complete, directly implementable brief.
              coder:
                extends: worker
                brief: You are the implementation role. Follow the brief exactly; make no design decisions.
                maxTokens: 65536
              reviewer:
                extends: worker
                brief: You are the review role. Review correctness, edge cases, and style; report findings only.
            taskRouting:
              plan: planner
              implement: coder
              review: reviewer
